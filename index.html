<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Little Boar &amp; Puki</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b0a14;color:#fff;overflow:hidden;
    font-family:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace}
  #stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  #game{position:relative;overflow:hidden;--u:3px}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  .hidden{display:none !important}
  #hud{position:absolute;left:calc(var(--u)*3);top:calc(var(--u)*3);right:calc(var(--u)*3);
    font-size:calc(var(--u)*2.6);line-height:1.7;text-shadow:calc(var(--u)*.4) calc(var(--u)*.4) 0 #000;pointer-events:none}
  #hud .obj{margin-top:calc(var(--u)*1);color:#ffe9a0;font-size:calc(var(--u)*2.2)}
  #toast{position:absolute;top:calc(var(--u)*24);left:50%;transform:translateX(-50%);background:#14102aee;border:calc(var(--u)*.7) solid #f4e7b0;
    padding:calc(var(--u)*2) calc(var(--u)*3);font-size:calc(var(--u)*2.6);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  #toast.on{opacity:1}
  #dlg{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*6);bottom:calc(var(--u)*5);background:#14102af2;
    border:calc(var(--u)*1) solid #f4e7b0;padding:calc(var(--u)*4) calc(var(--u)*5);font-size:calc(var(--u)*3);line-height:1.7;min-height:calc(var(--u)*22)}
  #dname{position:absolute;top:calc(var(--u)*-5.5);left:calc(var(--u)*4);background:#f4e7b0;color:#14102a;padding:calc(var(--u)*1) calc(var(--u)*3);font-size:calc(var(--u)*2.6)}
  #dnext{position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*2);animation:blink .8s infinite}
  @keyframes blink{50%{opacity:0}}
  #dchoices div{padding:calc(var(--u)*.6) 0;cursor:pointer}
  #dchoices div.sel{color:#ffe66b}
  #dchoices div.sel::before{content:'▶ '}
  #dchoices div:not(.sel)::before{content:'\00a0\00a0 '}
  #dinput{width:100%;box-sizing:border-box;margin-top:calc(var(--u)*2);background:#000;color:#fff;border:calc(var(--u)*.6) solid #f4e7b0;
    font:inherit;padding:calc(var(--u)*1.5)}
  #journal{position:absolute;inset:calc(var(--u)*8);background:#14102af7;border:calc(var(--u)*1) solid #f4e7b0;padding:calc(var(--u)*4);
    font-size:calc(var(--u)*2.4);line-height:1.9;overflow:auto}
  #journal h2{margin:0 0 calc(var(--u)*2);font-size:calc(var(--u)*3.4);color:#ffe66b}
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(ellipse at center,#0b0a1455,#0b0a14cc)}
  #title h1{font-size:calc(var(--u)*7);line-height:1.4;margin:0 0 calc(var(--u)*8);color:#ffe66b;text-shadow:calc(var(--u)*.8) calc(var(--u)*.8) 0 #7a3a1a}
  #title button{display:block;margin:calc(var(--u)*2) auto;background:#f4e7b0;color:#14102a;border:0;font:inherit;font-size:calc(var(--u)*3.4);
    padding:calc(var(--u)*2.5) calc(var(--u)*6);cursor:pointer}
  #title button:hover,#title button:focus{background:#ffe66b;outline:none}
  #title p{font-size:calc(var(--u)*2);line-height:2;color:#cfc8e8;margin-top:calc(var(--u)*7)}
  .bubble{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:none;background:#14102af0;
    border:calc(var(--u)*.5) solid #f4e7b0;padding:calc(var(--u)*.9) calc(var(--u)*1.6);font-size:max(8px,calc(var(--u)*2.4));line-height:1}
  .bubble .k{display:inline-block;background:#ffe66b;color:#14102a;padding:calc(var(--u)*.6) calc(var(--u)*1);margin-right:calc(var(--u)*1.2)}
  .bubble.em{background:#fff;color:#14102a;border-color:#14102a;font-size:max(8px,calc(var(--u)*2.8))}
  #fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .6s;pointer-events:none}
</style>
</head>
<body>
<div id="stage"><div id="game">
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="toast"></div>
  <div id="tip" class="bubble hidden"><span class="k">E</span><span id="tipl"></span></div>
  <div id="emB" class="bubble em hidden"></div><div id="emP" class="bubble em hidden"></div>
  <div id="dlg" class="hidden">
    <div id="dname"></div><div id="dtext"></div><div id="dchoices"></div>
    <input id="dinput" class="hidden" maxlength="80" autocomplete="off" spellcheck="false">
    <div id="dnext" class="hidden">▼</div>
  </div>
  <div id="journal" class="hidden"></div>
  <div id="title">
    <h1>Little Boar<br>&amp; Puki</h1>
    <div id="tbtns"></div>
    <p>Arrows / WASD: move &nbsp; E: talk &amp; use &nbsp; Q: dig<br>F: sniff &nbsp; Tab: journal &nbsp; M: sound</p>
  </div>
  <div id="fade"></div>
</div></div>

<script>
'use strict';
/* =====================================================================
   LITTLE BOAR & PUKI  -  a tiny pixel-art adventure with an AI Dungeon Master
   ---------------------------------------------------------------------
   AI SETUP (optional):  put the address of your proxy below (see worker.js).
   Leave it empty and the game still works with hand-written replies.
   ===================================================================== */
const AI_CONFIG = { url: 'https://restless-river-93d7.kovacskatalinkisvad.workers.dev/', timeoutMs: 9000, maxCallsPerSession: 80 };

/* ---------- basics ---------- */
const W = 320, H = 192, T = 16, MW = 56, MH = 40;
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H; ctx.imageSmoothingEnabled = false;
const lcv = document.createElement('canvas'); lcv.width = W; lcv.height = H;
const lctx = lcv.getContext('2d');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pick = a => a[Math.floor(Math.random() * a.length)];

let SC = 3;
function resize() {
  const s = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
  SC = s; const g = $('game'); g.style.width = W * s + 'px'; g.style.height = H * s + 'px'; g.style.setProperty('--u', s + 'px');
}
addEventListener('resize', resize); resize();

/* ---------- sound (tiny synth, no files) ---------- */
let AC = null, muted = false;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d = 0.08, type = 'square', v = 0.04, slide = 0) {
  if (muted || !AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d);
}
const sfx = {
  flash: () => tone(500, .3, 'sine', .06, 800),
  squeal: () => tone(1500, .4, 'sawtooth', .04, -1000),
  pick: () => { tone(700, .06); setTimeout(() => tone(1050, .09), 70); },
  dig: () => tone(140, .12, 'square', .05, -70),
  ding: () => { tone(880, .15, 'sine', .06); setTimeout(() => tone(1320, .25, 'sine', .06), 120); },
  yay: () => [660, 880, 1100].forEach((f, i) => setTimeout(() => tone(f, .12, 'square', .04), i * 90)),
  tink: () => tone(1800 + Math.random() * 600, .05, 'triangle', .04)
};

/* ---------- save data ---------- */
const SAVE_KEY = 'littleboar_save_v1';
const newState = () => ({
  introDone: false, day: 1,
  items: { berries: 0, bugs: 0, worms: 0, truffles: 0, apples: 0, gears: 0 },
  sniff: 1, sniffXp: 0, wisdom: 0,
  q: { bramble: 0, olwin: 0, rusty: 0 },
  chats: { bramble: 0, olwin: 0, rusty: 0 },
  found: {}, apples: {}, berries: {}, bridge: false, gearsNoted: false, px: 0, py: 0
});
let S = newState();
function save() {
  if (!S.introDone) return;
  S.px = boar.x; S.py = boar.y;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}
function loadSave() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (d && d.introDone) { const n = newState(); return Object.assign(n, d, { items: Object.assign(n.items, d.items) }); }
  } catch (e) {}
  return null;
}

/* ---------- world generation (same forest every time) ---------- */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(a, b, c) { let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0; return (h ^ (h >>> 16)) >>> 0; }
const RNG = mulberry(20261125);
const ground = [], solid = [], reserved = [];
for (let y = 0; y < MH; y++) { ground.push(new Uint8Array(MW)); solid.push(new Uint8Array(MW)); reserved.push(new Uint8Array(MW)); }
const inMap = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH;
function reserve(cx, cy, r) { for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) if (inMap(x, y)) reserved[y][x] = 1; }

const FEAT = {
  hut: { tx: 5, ty: 4 }, dig: { tx: 18, ty: 10 },
  bramble: [31, 10], olwin: [38, 22], rusty: [22, 30],
  apples: [[27, 14], [34, 15], [29, 7], [36, 8]],
  berries: [[12, 5], [11, 13], [20, 7], [25, 17], [33, 21], [40, 13], [18, 24], [8, 12], [30, 26]],
  truffles: [[9, 16], [24, 6], [35, 27], [19, 28], [41, 31]],
  rock: [13, 30], stash: [14, 32], sign: [50, 19], bridgeRows: [19, 20], river: [46, 47]
};
const doorX = 6 * T + 8, doorY = 7 * T + 6;
const digX = FEAT.dig.tx * T + 8, digY = FEAT.dig.ty * T + 8;

// path
(function () {
  const pts = [[6, 8], [6, 10], [15, 10], [15, 12], [30, 12], [30, 19], [45, 19]];
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
    for (let x = Math.min(x0, x1); x <= Math.max(x0, x1) + (y0 === y1 ? 0 : 1); x++)
      for (let y = Math.min(y0, y1); y <= Math.max(y0, y1) + (x0 === x1 ? 0 : 1); y++) if (inMap(x, y)) { ground[y][x] = 1; reserved[y][x] = 1; }
  }
})();
ground[FEAT.dig.ty][FEAT.dig.tx] = 2; ground[FEAT.dig.ty][FEAT.dig.tx + 1] = 2;
// river + broken bridge
for (let y = 0; y < MH; y++) for (let x = FEAT.river[0]; x <= FEAT.river[1]; x++) { ground[y][x] = 3; solid[y][x] = 1; reserved[y][x] = 1; }
function applyBridge() {
  for (let y = FEAT.bridgeRows[0]; y <= FEAT.bridgeRows[1]; y++) for (let x = FEAT.river[0]; x <= FEAT.river[1]; x++) {
    if (S.bridge) { ground[y][x] = 4; solid[y][x] = 0; } else { ground[y][x] = 3; solid[y][x] = 1; }
  }
}
// pond
for (let y = 20; y <= 23; y++) for (let x = 22; x <= 26; x++) {
  const dx = (x - 24) / 2.7, dy = (y - 21.5) / 2.1;
  if (dx * dx + dy * dy <= 1) { ground[y][x] = 3; solid[y][x] = 1; reserved[y][x] = 1; }
}
// hut + features
for (let y = 4; y <= 6; y++) for (let x = 5; x <= 7; x++) solid[y][x] = 1;
for (let y = 3; y <= 8; y++) for (let x = 4; x <= 8; x++) reserved[y][x] = 1;
[FEAT.bramble, FEAT.olwin, FEAT.rusty].forEach(([x, y]) => reserve(x, y, 2));
FEAT.apples.forEach(([x, y]) => { reserve(x, y, 1); solid[y][x] = 1; });
FEAT.berries.forEach(([x, y]) => { reserve(x, y, 1); solid[y][x] = 1; });
FEAT.truffles.forEach(([x, y]) => reserve(x, y, 1));
reserve(FEAT.rock[0], FEAT.rock[1], 1); solid[FEAT.rock[1]][FEAT.rock[0]] = 1;
reserve(FEAT.stash[0], FEAT.stash[1], 1);
reserve(FEAT.sign[0], FEAT.sign[1], 2); solid[FEAT.sign[1]][FEAT.sign[0]] = 1;
reserve(FEAT.dig.tx, FEAT.dig.ty, 2);
// trees
const trees = [];
for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
  if (solid[y][x] || reserved[y][x] || ground[y][x] === 3) continue;
  const edge = x === 0 || y === 0 || x === MW - 1 || y === MH - 1;
  const nearEdge = x <= 2 || y <= 2 || x >= MW - 3 || y >= MH - 3;
  const meadow = x >= 9 && x <= 25 && y >= 6 && y <= 14;           // clearing around the digging spot
  let p = meadow ? 0 : nearEdge ? 0.65 : 0.14;
  if (x > FEAT.river[1] && x < MW - 3 && !(y >= 17 && y <= 22)) p = Math.max(p, 0.4);
  if (edge || RNG() < p) { solid[y][x] = 1; trees.push({ tx: x, ty: y, v: hash(x, y, 9) % 3 }); }
}
// objects
const objs = [];
FEAT.apples.forEach(([x, y], i) => objs.push({ type: 'apple', id: 'a' + i, x: x * T + 8, y: y * T + 14 }));
FEAT.berries.forEach(([x, y], i) => objs.push({ type: 'berry', id: 'b' + i, x: x * T + 8, y: y * T + 14 }));
objs.push({ type: 'rock', id: 'rock', x: FEAT.rock[0] * T + 8, y: FEAT.rock[1] * T + 14 });
objs.push({ type: 'sign', id: 'sign', x: FEAT.sign[0] * T + 8, y: FEAT.sign[1] * T + 14 });
const bridgeSpot = { x: 45 * T + 10, y: 19 * T + 14 };
const buried = FEAT.truffles.map(([x, y], i) => ({ id: 't' + i, kind: 'truffle', x: x * T + 8, y: y * T + 9 }));
buried.push({ id: 'stash', kind: 'stash', x: FEAT.stash[0] * T + 8, y: FEAT.stash[1] * T + 9 });
const stashItem = buried[buried.length - 1];

/* ---------- characters ---------- */
const boar = { x: 0, y: 0, dir: 'down', moving: false, t: 0, shake: 0, hop: 0, hopMax: .45, scared: false, stumble: 0, emote: null, target: null, digging: false, visible: true };
const puki = { x: 0, y: 0, dir: 'down', moving: false, t: 0, shake: 0, hop: 0, hopMax: .45, emote: null, target: null, follow: false, visible: true, bulb: false, blush: false, stuck: 0 };
const npcs = [
  { id: 'bramble', name: 'Bramble', kind: 'hedgehog', x: FEAT.bramble[0] * T + 8, y: FEAT.bramble[1] * T + 12, f: -1, pitch: 260, seed: 1 },
  { id: 'olwin', name: 'Olwin', kind: 'owl', x: FEAT.olwin[0] * T + 8, y: FEAT.olwin[1] * T + 12, f: -1, pitch: 170, seed: 2 },
  { id: 'rusty', name: 'Rusty', kind: 'fox', x: FEAT.rusty[0] * T + 8, y: FEAT.rusty[1] * T + 12, f: 1, pitch: 390, seed: 3 }
];
const npcById = id => npcs.find(n => n.id === id);

/* ---------- runtime state ---------- */
let mode = 'title';          // title | play | cutscene | dialog
let time = 0, dark = 0.55, darkT = 0.55, dusk = 1;
const cam = { x: 0, y: 0 };
const keys = {};
const timers = [], lights = [], particles = [], effects = [];
let journalOpen = false, hudTimer = 0, saveTimer = 0, toastTimer = 0;
let sniffHint = null, target = null, busy = false;

const wait = ms => new Promise(r => timers.push({ t: ms / 1000, r }));
function setDir(e, dx, dy) { e.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); }
function walkTo(e, x, y, speed = 50) { return new Promise(res => { e.target = { x, y, speed, res }; }); }
function emote(e, txt, ms = 1200) { e.emote = { txt, t: ms / 1000 }; }
function hop(e, d = .45) { e.hop = d; e.hopMax = d; }
function faceTo(e, o) { setDir(e, o.x - e.x, o.y - e.y); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function addLight(x, y, r, dur) { lights.push({ x, y, r, t: 0, dur }); }
function flash(x, y) { sfx.flash(); addLight(x, y, 46, 1.4); }
function burst(x, y, n, colors, spd = 30, life = .6) {
  for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - .5) * spd, vy: -Math.random() * spd, life: life * (.5 + Math.random()), c: pick(colors), s: Math.random() < .3 ? 2 : 1 });
}
function toast(msg, ms = 2200) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), ms);
}
async function fadeOut() { $('fade').style.opacity = 1; await sleep(650); }
async function fadeIn() { $('fade').style.opacity = 0; await sleep(650); }

/* ---------- dialogue ---------- */
let dlgRes = null, typing = false, typeFull = '', typeT = 0, lastBlip = 0, curPitch = 300;
let chRes = null, chSel = 0, chCount = 0, inputRes = null;
function say(name, text, pitch) {
  return new Promise(res => {
    $('dlg').classList.remove('hidden'); $('dname').textContent = name; $('dname').style.display = name ? '' : 'none';
    $('dchoices').innerHTML = ''; $('dinput').classList.add('hidden'); $('dnext').classList.add('hidden');
    curPitch = pitch || (name === 'Puki' ? 520 : name === 'Little Boar' ? 300 : 200);
    typeFull = text; typeT = 0; lastBlip = 0; typing = true; $('dtext').textContent = ''; dlgRes = res;
  });
}
function advanceDialog() {
  if (typing) { typing = false; $('dtext').textContent = typeFull; $('dnext').classList.remove('hidden'); return; }
  const r = dlgRes; dlgRes = null; $('dlg').classList.add('hidden'); if (r) r();
}
function choose(opts, prompt) {
  return new Promise(res => {
    typing = false; dlgRes = null;
    $('dlg').classList.remove('hidden'); $('dname').style.display = 'none';
    $('dtext').textContent = prompt || ''; $('dnext').classList.add('hidden'); $('dinput').classList.add('hidden');
    chSel = 0; chCount = opts.length; chRes = res;
    const box = $('dchoices'); box.innerHTML = '';
    opts.forEach((o, i) => { const d = document.createElement('div'); d.textContent = o; if (i === 0) d.className = 'sel';
      d.onclick = () => { chSel = i; confirmChoice(); }; d.onmouseenter = () => { chSel = i; renderSel(); }; box.appendChild(d); });
  });
}
function renderSel() { [...$('dchoices').children].forEach((d, i) => d.className = i === chSel ? 'sel' : ''); }
function confirmChoice() { const r = chRes; chRes = null; const i = chSel; $('dchoices').innerHTML = ''; $('dlg').classList.add('hidden'); if (r) r(i); }
function askText(prompt) {
  return new Promise(res => {
    typing = false; dlgRes = null;
    $('dlg').classList.remove('hidden'); $('dname').style.display = 'none'; $('dchoices').innerHTML = '';
    $('dtext').textContent = prompt; $('dnext').classList.add('hidden');
    const inp = $('dinput'); inp.value = ''; inp.classList.remove('hidden'); inputRes = res; setTimeout(() => inp.focus(), 30);
  });
}
$('dinput').addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter' || e.key === 'Escape') {
    const v = e.key === 'Enter' ? $('dinput').value.trim() : null; const r = inputRes; inputRes = null;
    $('dinput').classList.add('hidden'); $('dinput').blur(); $('dlg').classList.add('hidden'); if (r) r(v || null);
  }
});

/* ---------- the AI Dungeon Master ---------- */
const FALL = {
  bramble: ['Oh, the forest is lovely this time of year, dear. Mind the brambles!', 'Apple pie is best when it is still warm. Everything is, really.',
    "Why don't hedgehogs share? They're a bit too prickly! Hee hee.", 'My back is spiky, but my heart is soft as pie crust.'],
  olwin: ['Hoo... the forest has its secrets. Listen closely and it will tell you some.', 'Wisdom is just curiosity that has had a long nap, little boar.',
    'A good nose is a fine thing, but a good question is better. Hoo.', 'I once counted every star. Then I lost count. Hoo, that was a lovely night.'],
  rusty: ['Pranks are just surprise presents, little boar!', 'Foxes can hear a mouse across the meadow. Not that I would prank a mouse... much.',
    'Truffles smell like secrets. Delicious secrets.', 'Why did the fox cross the log? To get to the other side-eye! Hee hee.']
};
const hist = { bramble: [], olwin: [], rusty: [] };
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
let aiCalls = 0, aiLast = 0;
// The game only says WHICH animal, what the player typed and a few small facts.
// Personas, rules and limits live in worker.js, so the page can't be used to talk to the AI "freely".
async function askDM(n, text, wantHint = false) {
  const fallback = () => wantHint ? 'Hmm, let me think... ' + cap(hintFor(n)) + '.' : pick(FALL[n.id]);
  if (!AI_CONFIG.url || aiCalls >= AI_CONFIG.maxCallsPerSession) { await wait(350); return fallback(); }
  aiCalls++;
  const gap = 1500 - (Date.now() - aiLast); if (gap > 0) await sleep(gap);   // gentle pacing
  aiLast = Date.now();
  const payload = { npc: n.id, text: String(text || '').slice(0, 80), hint: wantHint, q: S.q[n.id], apples: S.items.apples, day: S.day, recent: hist[n.id].slice(-3) };
  try {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), AI_CONFIG.timeoutMs);
    const res = await fetch(AI_CONFIG.url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: ctl.signal });
    clearTimeout(to);
    const data = await res.json();
    const out = String(data.text || '').replace(/\s+/g, ' ').trim().slice(0, 240);
    if (!out) throw new Error(data.error || 'empty reply');
    if (!wantHint) hist[n.id].push([payload.text, out]);
    return out;
  } catch (err) { console.warn('AI DM unavailable, using fallback:', err); return fallback(); }
}

    else if (q.rusty === 2) {

      toast('Got a gear!  ⚙');
    }
  }

    const opts = ['Chat', 'Ask for a hint', 'Goodbye']; if (n.id === 'olwin' && q.olwin === 1) opts.splice(1, 0, 'Try a riddle');
    const c = opts[await choose(opts, `Talk to ${n.name}:`)];

function nearest() {
  let best = null, bd = 1e9;
  const c = (k, o, x, y, r, label, bias = 0) => { const d = Math.hypot(boar.x - x, boar.y - y); if (d < r && d + bias < bd) { bd = d + bias; best = { k, o, x, y, label }; } };
  // a spot you have sniffed out always comes first
  buried.forEach(b => { if (b.smelled && !S.found[b.id] && (b.kind !== 'stash' || S.q.rusty >= 1)) c('dig2', b, b.x, b.y, 18, 'Dig', -100); });
  npcs.forEach(n => c('npc', n, n.x, n.y, 26, 'Talk'));
  if (puki.visible) c('puki', puki, puki.x, puki.y, 22, 'Puki', 14);   // Puki never wins a tie
  c('door', null, doorX, doorY, 24, 'Sleep');
  objs.forEach(o => {
    if (o.type === 'apple' && (S.apples[o.id] || 0) < 2) c('apple', o, o.x, o.y, 24, 'Pick apple');
    else if (o.type === 'berry' && (S.berries[o.id] || 0) < 3) c('berry', o, o.x, o.y, 24, 'Eat berries');
    else if (o.type === 'sign') c('sign', o, o.x, o.y, 24, 'Read');
  });
  c('bridge', null, bridgeSpot.x, bridgeSpot.y, 26, S.bridge ? 'Bridge' : S.items.gears >= 3 ? 'Fix bridge' : 'Look');
  c('dig', null, digX + 8, digY + 4, 20, 'Dig');
  return best;
}

    for (let i = 0; i < 6; i++) { p(-7 + i * 2, -11 + (i % 2), 1, 3, '#3d2818'); p(-6 + i * 2, -10, 1, 2, '#8a6a4a'); }
    p(4, -7, 5, 5, '#e0bf98'); p(8, -6, 2, 2, '#222'); p(6, -6, 1, 1, '#222'); p(4, -9, 2, 2, '#e0bf98'); p(1, -5, 3, 4, '#fff');
    p(-4, -1, 2, 1, '#e0bf98'); p(2, -1, 2, 1, '#e0bf98');
  } else if (n.kind === 'owl') {
    p(-7, -10, 2, 7, '#6e5436'); p(5, -10, 2, 7, '#6e5436');
    p(-5, -15, 10, 14, '#8b6b47'); p(-3, -9, 6, 7, '#d9c79c');
    p(-4, -13, 4, 4, '#fff'); p(0, -13, 4, 4, '#fff'); p(-3, -12, 2, 2, '#111'); p(1, -12, 2, 2, '#111'); p(-1, -10, 2, 2, '#e8a020');
    p(-4, -14, 4, 1, '#e8e8e8'); p(0, -14, 4, 1, '#e8e8e8'); p(-5, -17, 2, 3, '#6e5436'); p(3, -17, 2, 3, '#6e5436');
    p(-3, -1, 2, 1, '#e8a020'); p(1, -1, 2, 1, '#e8a020');
  } else {
    p(-11, -9, 5, 4, '#e0702a'); p(-12, -9, 2, 4, '#fff');
    p(-6, -8, 11, 5, '#e0702a'); p(-3, -5, 6, 2, '#f4c9a0');
    p(3, -10, 5, 5, '#e0702a'); p(7, -8, 3, 2, '#e0702a'); p(9, -8, 1, 1, '#111'); p(6, -9, 1, 1, '#111'); p(5, -7, 3, 1, '#fff');
    p(3, -13, 2, 3, '#e0702a'); p(6, -13, 2, 3, '#e0702a'); p(3, -13, 2, 1, '#4a2a1a'); p(6, -13, 2, 1, '#4a2a1a');
    p(-5, -3, 2, 3, '#4a2a1a'); p(1, -3, 2, 3, '#4a2a1a');
  }
  if (target && target.o === n) drawKey(sx, sy - (n.kind === 'owl' ? 22 : 17), target.label);
}
let tipPos = null, emPos = {};
function drawEmote(e, x, y) { if (e.emote) emPos[e === boar ? 'b' : 'p'] = { x, y: y + 5, txt: e.emote.txt }; }
function drawKey(x, y, label) { tipPos = { x, y: y + 2, label }; }
function placeOverlays() {
  const put = (el, p, set) => {
    if (!p) { el.classList.add('hidden'); return; }
    el.classList.remove('hidden'); set(el, p);
    el.style.left = Math.round(p.x * SC) + 'px'; el.style.top = Math.round(p.y * SC) + 'px';
  };
  put($('tip'), tipPos, (el, p) => { if (el._t !== p.label) { el._t = p.label; $('tipl').textContent = p.label; } });
  put($('emB'), emPos.b, (el, p) => { if (el._t !== p.txt) { el._t = p.txt; el.textContent = p.txt; } });
  put($('emP'), emPos.p, (el, p) => { if (el._t !== p.txt) { el._t = p.txt; el.textContent = p.txt; } });
}
function drawLights() {
  const L = [];
  lights.forEach(l => { const a = Math.min(1, l.t / .15, (l.dur - l.t) / .3); L.push({ x: l.x, y: l.y, r: l.r * (.7 + .3 * a), a }); });
  if (puki.bulb && puki.visible) L.push({ x: puki.x, y: puki.y - 22, r: 70 + Math.sin(time * 5) * 2, a: 1 });
  if (dark > .15) L.push({ x: FEAT.hut.tx * T + 12, y: FEAT.hut.ty * T + 32, r: 34, a: .9 }, { x: doorX, y: doorY - 6, r: 22, a: .7 });
  if (dusk > 0) { ctx.fillStyle = `rgba(255,120,40,${.17 * dusk * (1 - dark * .6)})`; ctx.fillRect(0, 0, W, H); }
  if (dark > .01) {
    lctx.globalCompositeOperation = 'source-over'; lctx.clearRect(0, 0, W, H); lctx.fillStyle = `rgba(8,6,36,${.86 * dark})`; lctx.fillRect(0, 0, W, H);
    lctx.globalCompositeOperation = 'destination-out';
    L.forEach(l => { for (let i = 0; i < 6; i++) { lctx.fillStyle = `rgba(0,0,0,${.3 * l.a})`; lctx.beginPath(); lctx.arc(Math.round(l.x - cam.x), Math.round(l.y - cam.y), l.r * (1 - i * .15), 0, 7); lctx.fill(); } });
    ctx.drawImage(lcv, 0, 0);
  }
  lights.forEach(l => { const a = Math.min(1, l.t / .15, (l.dur - l.t) / .3), x = Math.round(l.x - cam.x), y = Math.round(l.y - cam.y);
    ctx.fillStyle = `rgba(255,250,200,${.9 * a})`; ctx.fillRect(x - 1, y - 5, 3, 11); ctx.fillRect(x - 5, y - 1, 11, 3); ctx.fillRect(x - 2, y - 2, 5, 5); });
}
function draw() {
  const cx = Math.round(cam.x), cy = Math.round(cam.y); tipPos = null; emPos = {};
  ctx.fillStyle = '#2f5d2f'; ctx.fillRect(0, 0, W, H);
  const tx0 = Math.floor(cx / T), ty0 = Math.floor(cy / T);
  for (let ty = ty0; ty <= ty0 + H / T + 1; ty++) for (let tx = tx0; tx <= tx0 + W / T + 1; tx++) if (inMap(tx, ty)) drawTile(tx, ty, tx * T - cx, ty * T - cy);
  // buried item glints (only after sniffing)
  if (sniffHint) { const b = sniffHint.b, a = Math.sin(time * 10) > 0; ctx.fillStyle = a ? '#fff' : '#ffe66b'; ctx.fillRect(Math.round(b.x - cx), Math.round(b.y - cy - 2), 1, 3); ctx.fillRect(Math.round(b.x - cx) - 1, Math.round(b.y - cy - 1), 3, 1); }
  const list = [];
  trees.forEach(t => { const bx = t.tx * T - cx, by = t.ty * T - cy; if (bx > -30 && bx < W + 30 && by > -20 && by < H + 50) list.push({ y: t.ty * T + 14, d: () => drawTree(t, cx, cy, 0) }); });
  objs.forEach(o => {
    if (o.x - cx < -30 || o.x - cx > W + 30 || o.y - cy < -30 || o.y - cy > H + 50) return;
    if (o.type === 'apple') list.push({ y: o.y, d: () => { drawTree({ tx: (o.x - 8) / T, ty: (o.y - 14) / T, v: 2 }, cx, cy, 2 - (S.apples[o.id] || 0)); if (target && target.o === o) drawKey(o.x - cx, o.y - cy - 32, target.label); } });
    else if (o.type === 'berry') list.push({ y: o.y, d: () => { drawBush(o, cx, cy); if (target && target.o === o) drawKey(o.x - cx, o.y - cy - 14, target.label); } });
    else if (o.type === 'rock') list.push({ y: o.y, d: () => drawRock(o, cx, cy) });
    else if (o.type === 'sign') list.push({ y: o.y, d: () => { drawSign(o, cx, cy); if (target && target.o === o) drawKey(o.x - cx, o.y - cy - 20, target.label); } });
  });
  list.push({ y: (FEAT.hut.ty + 3) * T, d: () => { drawHut(cx, cy); if (target && target.k === 'door') drawKey(doorX - cx, doorY - cy - 22, target.label); } });
  npcs.forEach(n => list.push({ y: n.y, d: () => drawNPC(n) }));
  list.push({ y: boar.y, d: drawBoar }); if (puki.visible) list.push({ y: puki.y, d: drawPuki });
  list.sort((a, b) => a.y - b.y).forEach(i => i.d());
  if (target && ['puki', 'dig', 'dig2', 'bridge'].includes(target.k)) drawKey(target.x - cx, target.y - cy - (target.k === 'puki' ? 22 : 12), target.label);
  particles.forEach(p => { ctx.globalAlpha = Math.min(1, p.life * 3); ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x - cx), Math.round(p.y - cy), p.s, p.s); }); ctx.globalAlpha = 1;
  effects.forEach(e => e.draw());
  if (sniffHint) { const b = sniffHint.b, a = Math.atan2(b.y - boar.y, b.x - boar.x), d = Math.hypot(b.x - boar.x, b.y - boar.y), warm = 1 - d / sniffHint.rad;
    for (let k = 0; k < 5; k++) { ctx.fillStyle = `rgba(255,${Math.round(255 - warm * 120)},${Math.round(200 - warm * 150)},${.4 + k * .12})`; const s = 1 + (k > 2 ? 1 : 0);
      ctx.fillRect(Math.round(boar.x - cx + Math.cos(a) * (12 + k * 3)), Math.round(boar.y - cy - 6 + Math.sin(a) * (12 + k * 3)), s, s); } }
  drawLights(); placeOverlays();
}

/* ---------- main loop ---------- */
let last = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  update(dt); draw(); requestAnimationFrame(frame);
}
applyBridge(); buildTitle(); renderHud();
requestAnimationFrame(frame);
</script>
